version: '3.8'
services:
  scheduler:
    image: daskdev/dask:latest
    command: dask scheduler
    ports:
      - "8786:8786"   # Dask RPC
      - "8787:8787"   # Dashboard
    networks:
      - dask-net

  worker:
    image: daskdev/dask:latest
    command: dask worker tcp://scheduler:8786
    depends_on:
      - scheduler
    networks:
      - dask-net
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2.00'
          memory: 2.5G

networks:
  dask-net:
    driver: bridge
