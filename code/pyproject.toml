[project]
name = "flood-forecasts"
version = "0.0.0"
description = ""
authors = [
    {name = "Eldar Khuzin",email = "khuzin.e@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "geopandas (>=1.0.1,<2.0.0)",
    "scipy (>=1.15.2,<2.0.0)",
    "polars[pyarrow] (>=1.25.2,<2.0.0)",
    "marimo (>=0.11.21,<0.12.0)",
    "folium (>=0.19.5,<0.20.0)",
    "plotly (>=6.0.1,<7.0.0)",
    "matplotlib (>=3.10.1,<4.0.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "kepler (>=0.0.1,<0.0.2)",
    "keplergl (>=0.3.7,<0.4.0)",
    "duckdb (>=1.2.1,<2.0.0)",
    "sqlglot (>=26.11.1,<27.0.0)",
    "altair (>=5.5.0,<6.0.0)",
    "vegafusion (>=2.0.2,<3.0.0)",
    "vl-convert-python (>=1.7.0,<2.0.0)",
    "black (>=25.1.0,<26.0.0)",
    "openai (>=1.66.5,<2.0.0)",
    "nbformat (>=5.10.4,<6.0.0)",
    "dask (>=2025.2.0,<2026.0.0)",
    "darts (>=0.34.0,<0.35.0)",
    "catboost (>=1.2.7,<2.0.0)",
    "xarray (>=2025.1.2,<2026.0.0)",
    "netcdf4 (>=1.7.2,<2.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "tabulate (>=0.9.0,<0.10.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "ipykernel (>=6.29.5,<7.0.0)",
    "jupyterhub (>=5.2.1,<6.0.0)",
    "ipython (>=9.0.2,<10.0.0)",
    "jupyterlab (>=4.3.6,<5.0.0)",
    "jupyterlab-lsp (>=5.1.0,<6.0.0)",
    "python-lsp-server[all] (>=1.12.2,<2.0.0)",
    "fastcluster (>=1.2.6,<2.0.0)",
    "jupyterlab-code-formatter (>=3.0.2,<4.0.0)",
    "shap (>=0.47.1,<0.48.0)"
]

[tool.poetry]
packages = [
    {include = "experiments", from = "src"},
    {include = "utils", from = "src"}
]
package-mode=false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.marimo.runtime]
output_max_bytes = 20_000_000


