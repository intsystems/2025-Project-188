[project]
name = "pro-1-experiments"
version = "1.0.0"
description = ""
authors = [
    {name = "Eldar Khuzin",email = "khuzin.e@gmail.com"}
]
readme = "README.md"
requires-python = "==3.11.12"
dependencies = [
    "dask[complete] (==2025.4.1)",
    "distributed (==2025.4.1)",
    "geopandas (>=1.0.1,<2.0.0)",
    "scipy (>=1.15.2,<2.0.0)",
    "matplotlib (>=1.5,<3.9)",
    "tqdm (>=4.67.1,<5.0.0)",
    "xarray (>=2025.1.2,<2026.0.0)",
    "netcdf4 (>=1.7.2,<2.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "ipykernel (>=6.29.5,<7.0.0)",
    "fastcluster (>=1.2.6,<2.0.0)",
    "shap (>=0.47.1,<0.48.0)",
    "fastparquet (>=2024.11.0,<2025.0.0)",
    "bokeh (==3.7.2)",
    "panel (==1.6.3)",
    "polars (>=1.29.0,<2.0.0)",
    "xgboost (==2.1.4)",
    # "dask_cuda (==25.02.00)",
    "iprogress (>=0.4,<0.5)",
    "ipywidgets (>=8.1.7,<9.0.0)",
    "folium (>=0.19.6,<0.20.0)",
    "contextily (>=1.6.2,<2.0.0)",
    "elevation (>=1.1.3,<2.0.0)",
    "cartopy (>=0.24.1,<0.25.0)",
    "selenium (>=4.32.0,<5.0.0)",
    "basemap (>=1.4.1,<2.0.0)",
    "basemap-data-hires (>=1.3.2,<2.0.0)",
]

[tool.poetry2conda]
name = "pro-1-experiments-conda"

[tool.poetry]
packages = [
    {include = "utils", from = "src"},
    {include = "newutils", from = "src"},
    {include = "oldutils", from = "src"},
    {include = "config", from = "src"},
]
package-mode=true

[tool.poetry.dependencies]
xgboost = {allow-prereleases = true}
[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.marimo.runtime]
output_max_bytes = 20_000_000


